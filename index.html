<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rock Paper Scissors</title>

        <script type="module" src="/script.js" defer></script>

        <link rel="stylesheet" href="./styles.css">
    </head>

    <body>
        <div class="player-choices">
            <button class="rock-button">Rock</button>
            <button class="paper-button">Paper</button>
            <button class="scissors-button">Scissors</button>
        </div>
        <div class="round-output">
            <h1 class="output-text">Make your choice!</h1>
            <div class="scoreboard">
                <h1 class="score-text">Game Score</h1>
                <div class="scores">
                    <div class="computer-score">
                        <h1 class="computer-number">0</h2>
                        <h3 class="computer-text">Opponent Score</h3>
                    </div>
                    <div class="player-score">
                        <h1 class="player-number">0</h2>
                        <h3 class="player-text">Your Score</h3>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
